<html lang="es">
<head>

<title>✦ Armario de Señas LSC ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Rubik+Bubbles&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f3519;--pk:#E598B8;--lil:#F2B5CF;--pale:#F4F1E1;--lit:#fff;--dk:#9a9a6a;--ol:#8B9A46;--old:#4b5521;--cr:#F4F1E1;--cr2:#E9E4CE;--pk2:#E598B8;--pk3:#F2B5CF;--yl:#FFF1A8}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background-color:#d9f0ff;
 background-image:linear-gradient(#ffffff80 1px,transparent 1px),linear-gradient(90deg,#ffffff80 1px,transparent 1px);background-size:18px 18px;min-height:100vh}
h1,h2,h3,.bub{font-family:'Rubik Bubbles',Montserrat,sans-serif;font-weight:400}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.win{background:var(--pale);border:3px solid;border-color:#fff var(--dk) var(--dk) #fff;box-shadow:5px 5px 0 #7f94b8;margin-bottom:16px}
.tb{background:linear-gradient(90deg,var(--pk),var(--lil));color:#fff;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:800;text-shadow:1px 1px 0 var(--ink)}
.tb i{font-style:normal;display:flex;gap:4px}.tb i b{background:var(--pale);color:var(--ink);width:18px;height:18px;font-size:11px;text-align:center;border:2px outset #fff;text-shadow:none}
.body{padding:14px}
.bv{background:#eaf7ff;color:var(--ink);font:800 .9rem Montserrat,sans-serif;padding:8px 14px;border:3px solid;border-color:#fff var(--dk) var(--dk) #fff;cursor:pointer}
.bv:active,.bv.on{border-color:var(--dk) #fff #fff var(--dk);background:#cfe9ff}
.bv:disabled{opacity:.5;cursor:not-allowed}
.go{background:linear-gradient(#a9ecd0,#8fd3ff);font-size:1.05rem;padding:10px 20px}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.screen{display:none}.screen.on{display:block;animation:pop .3s}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:#fff;border:3px solid;border-color:var(--dk) #fff #fff var(--dk);padding:8px;text-align:center}
.card img,.opt img{width:100%;aspect-ratio:0.56;object-fit:cover;background:#eaf4ff;display:block;image-rendering:auto}
.sw{display:inline-block;width:26px;height:26px;border:3px solid var(--ink);vertical-align:middle}
.canvas{background:#fff;background-image:linear-gradient(#e0eefc 1px,transparent 1px),linear-gradient(90deg,#e0eefc 1px,transparent 1px);background-size:14px 14px;border:3px solid;border-color:var(--dk) #fff #fff var(--dk);position:relative;overflow:hidden}
.paint{display:grid;grid-template-columns:190px 1fr;gap:10px}
@media(max-width:700px){.paint{grid-template-columns:1fr}.tools{flex-direction:row!important;flex-wrap:wrap}}
.tools{display:flex;flex-direction:column;gap:8px}
.tool{display:flex;align-items:center;gap:8px;text-align:left;width:100%}
.tool[disabled]{background:#c9f7dd;opacity:1}
.sil{fill:#7fd0ff33;stroke:#ff7f6e;stroke-width:3;stroke-dasharray:6 5;cursor:pointer;animation:glow 1.4s infinite}
.worn{stroke:#27304f;stroke-width:3;animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
.pal{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;align-items:center}
.pal span{width:26px;height:26px;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;opacity:.55}
.pal span.hit{opacity:1;outline:3px solid #ff7f6e;outline-offset:1px}
.opt{background:#fff;border:3px solid;border-color:#fff var(--dk) var(--dk) #fff;padding:6px;cursor:pointer;font:800 .9rem Montserrat;color:var(--ink)}
.opt.ok{background:#c9f7dd;animation:pop .3s}.opt.bad{background:#ffd0dc;animation:shake .4s}
.ov{position:fixed;inset:0;background:#27304f99;display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
.ov.on{display:flex}
.star{position:absolute;pointer-events:none;animation:fly 1s ease-out forwards;color:#ff7f6e;font-size:22px;z-index:5}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes glow{50%{fill:#7fd0ff66}}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

body{background:radial-gradient(circle,#fff9 0 2px,transparent 3px) 0 0/34px 34px,linear-gradient(135deg,#d9f0ff 25%,#fff6dc 25% 50%,#d9f0ff 50% 75%,#fff6dc 75%) 0 0/56px 56px}
.wrap{padding-bottom:64px;position:relative;z-index:1}
svg image{image-rendering:pixelated}
.menu{display:flex;gap:2px;background:#e6f6ee;border-bottom:2px solid var(--dk);padding:2px 6px}
.menu button{background:none;border:0;font:700 .85rem Montserrat;padding:3px 10px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:var(--lil);color:#fff}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#eaf4ff;padding:4px;border:2px inset #fff}
.tg button{font-size:1.1rem;padding:3px;background:#eaf7ff;border:2px solid;border-color:#fff var(--dk) var(--dk) #fff;cursor:pointer}
.tg button:active{border-color:var(--dk) #fff #fff var(--dk)}
.taskbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:10px;align-items:center;padding:5px 10px;background:linear-gradient(#bfe6ff,#a9ecd0);border-top:3px solid #fff;font-weight:800}
.pbar{flex:1;max-width:260px;height:18px;border:2px inset #fff;background:#fff;padding:1px}
.pbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ff7f6e 0 10px,transparent 10px 12px);transition:width .4s}
.stk{position:fixed;font-size:26px;z-index:0;animation:fl 4s ease-in-out infinite;pointer-events:none;opacity:.8}
@keyframes fl{50%{transform:translateY(-14px) rotate(12deg)}}
.flip{perspective:900px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:center}
.fi{position:relative;display:block;transform-style:preserve-3d;transition:transform .6s}
.flip.on .fi{transform:rotateY(180deg)}
.ff,.fb{backface-visibility:hidden;-webkit-backface-visibility:hidden;display:block}
.fb{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;gap:6px}
.fb img{flex:1;min-height:0;aspect-ratio:auto;height:100%}
.ff small{display:block;opacity:.6;font-size:.7rem}
.tb{color:var(--ink);text-shadow:none}
.win.a1 .tb{background:linear-gradient(90deg,#ffd98a,#ffb8a8)}
.win.a2 .tb{background:linear-gradient(90deg,#a6e8c8,#fff1a8)}
.win.a3 .tb{background:linear-gradient(90deg,#c9d4ff,#7fd0ff)}
.tool{background:#d7ebff}
.canvas{background-color:#e9f6ff}#cv{background:#d4f1e4}
img.stk{width:36px;height:auto;image-rendering:pixelated}
.star img{image-rendering:pixelated;display:block}
body{background:linear-gradient(#ffffff80 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,#ffffff80 1px,transparent 1px) 0 0/18px 18px,#ffd6f0}

/* ===== Paleta v2: ventana crema + verde oliva + rosado pastel (según imagen de referencia) ===== */
.win{background:var(--cr);border:2px solid var(--old);box-shadow:5px 5px 0 #4b552140}

.tool{background:var(--cr2)}
.tool[disabled]{background:#E2E8BC;color:var(--ink)}
.tg{background:var(--cr2)}.tg button{background:var(--cr)}
.sil{fill:#E598B833;stroke:#8B9A46}
@keyframes glow{50%{fill:#E598B866}}
.pal span.hit{outline-color:var(--pk2)}
.pbar{background:var(--cr);border:2px solid var(--old)}
.pbar i{background:repeating-linear-gradient(90deg,var(--pk2) 0 10px,transparent 10px 12px)}
.taskbar{background:linear-gradient(var(--cr),var(--cr2));border-top:3px solid var(--old)}
.ov{background:#2f351999}
*{scrollbar-color:#E598B8 #F4F1E1}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:var(--cr);border-left:2px solid var(--old)}
::-webkit-scrollbar-thumb{background:var(--pk2);border:2px solid var(--old)}

/* ===== Arrastrar y soltar ===== */
.hint{margin:-4px 0 12px;font-weight:800;font-size:.85rem;color:var(--old);background:var(--yl);border:2px dashed var(--ol);padding:6px 10px}
.tool.unl{background:linear-gradient(#FFF6BF,#FFE77A);border:3px solid var(--ol);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;animation:shine 1.2s ease-in-out infinite;box-shadow:0 0 0 2px #fff,0 0 14px 3px #f6e27a}
.tool.unl:active{cursor:grabbing}
.tool.unl small{font-weight:800;color:var(--old)}
@keyframes shine{50%{box-shadow:0 0 0 2px #fff,0 0 22px 7px #f6e27a}}
#dz{position:relative;height:100%;aspect-ratio:1/2;max-width:100%;margin:0 auto;border-radius:14px;transition:background .15s}
#dz.arm{outline:3px dashed #8B9A4699;outline-offset:-3px}
#dz.hot{outline:3px dashed var(--ol);outline-offset:-3px;background:#fff3b066;box-shadow:0 0 0 4px #fff3b0,0 0 22px 8px #f6e27acc;animation:hot 1s infinite}
@keyframes hot{50%{box-shadow:0 0 0 4px #fff3b0,0 0 32px 12px #f6e27a}}
.sil.ready{fill:#8B9A4640;stroke:#8B9A46;cursor:default;animation:none}
svg image.fresh{animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;background:#FFF1A8;border:3px solid var(--ol);padding:8px 12px;font:800 .9rem Montserrat,sans-serif;color:var(--ink);box-shadow:0 0 16px 4px #f6e27a;opacity:.95}
</style>

/* Rasteriza cada forma en una cuadrícula de 64x128 y la vuelve pixel art (estilo Dollz):
   contorno casi negro, luz arriba/izquierda, sombra abajo/derecha, tramado y pliegues. */
function pix(id, col, draw, fold, post) {
  const key = id + col; if (PC[key]) return PC[key];
  const a = document.createElement('canvas'); a.width = GW; a.height = GH;
  const x = a.getContext('2d', {willReadFrequently:true}); x.scale(GW / 200, GH / 400); draw(x);
  const d = x.getImageData(0, 0, GW, GH).data, m = (i, j) => i >= 0 && j >= 0 && i < GW && j < GH && d[(j * GW + i) * 4 + 3] > 100;
  const c = hx(col), dk = mixc(c, [40,30,80], .38), lt = mixc(c, [255,255,255], .42);
  const b = document.createElement('canvas'); b.width = GW; b.height = GH; const o = b.getContext('2d');
  const px = (i, j, k) => { o.fillStyle = k; o.fillRect(i, j, 1, 1); };
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    if (!m(i, j)) continue; let k = col;
    if (!m(i-1,j) || !m(i+1,j) || !m(i,j-1) || !m(i,j+1)) k = INK;
    else if (fold === 'p' && i % 6 === 0 && j > 56) k = dk;
    else if (fold === 'd' && (i + j * 2) % 17 === 0 && j % 4) k = dk;
    else if (fold === 's' && i % 4 === 0) k = dk;
    else if (fold === 'b' && (j + (i % 4 < 2 ? 0 : 2)) % 4 < 2) k = dk;
    else if (!m(i-2,j) || !m(i,j-2)) k = lt;
    else if (!m(i+2,j) || !m(i,j+2) || (!m(i+3,j) && (i + j) % 2)) k = dk;
    px(i, j, k);
  }
  if (post) post(px, dk, lt);
  return PC[key] = b.toDataURL();
}
const P2 = d => x => x.fill(new Path2D(d));

  $('s3').innerHTML = win('Armario — Misión ' + (S.mi + 1) + '/' + missions().length, `
    <h2 style="font-size:1.35rem;margin:0 0 12px;line-height:1.3">${m.title}</h2>
    ${pend.some(p => p.u) ? '<p class="hint">✦ ¡Prenda desbloqueada! Arrástrala hasta el personaje (o haz doble clic sobre ella).</p>' : ''}
    <div class="paint">
      <div class="tools"><div class="tg" aria-label="Herramientas decorativas">${['✏️','🪣','🧽','🔍','✨','🖌️'].map(t => `<button onclick="sparkle($('cv'))" aria-hidden="true" tabindex="-1">${t}</button>`).join('')}</div>${m.items.map((it, i) => S.unl[i] && !S.done[i] ? `
        <div class="bv tool unl" draggable="true" role="button" tabindex="0" data-i="${i}" aria-label="${V(it.g).es} desbloqueada. Arrástrala al personaje o pulsa Enter para vestirla" ondragstart="dStart(event,${i})" ondragend="dEnd()" ondblclick="dress(${i})" onkeydown="if(event.key==='Enter')dress(${i})">
          <span style="font-size:1.5rem">${V(it.g).icon}</span><span style="flex:1">${V(it.g).es}<br><small>¡Desbloqueada! Arrástrala al personaje</small></span>
          <span>✨</span></div>` : `
        <button class="bv tool" ${S.done[i] ? 'disabled' : ''} onclick="openChallenge(${i})">
          <span style="font-size:1.5rem">${V(it.g).icon}</span><span style="flex:1">${V(it.g).es}<br><small>${itCol(it)}</small></span>
          <span>${S.done[i] ? '✅' : '🔒'}</span></button>`).join('')}</div>
      <div><div id="cv" class="canvas" style="height:min(70vh,440px);padding:8px">${closet()}<div id="dz">${doll(S.g, worn, pend, S.fresh)}</div></div>
        <div class="pal">${cat('color').map(c => `<span class="${used.includes(c.id) ? 'hit' : ''}" style="background:${c.hex}" title="${c.es}">${used.includes(c.id) ? '✦' : ''}</span>`).join('')}</div></div>
    </div>`);
  bindDz();
}

/* ---------- Arrastrar y soltar (mouse + táctil + doble clic) ---------- */
const T = {i:null, ghost:null, moved:false, sx:0, sy:0, last:0, lastI:null};
const dzOf = () => $('dz');
const inDz = (x, y) => { const z = dzOf(); if (!z) return false; const r = z.getBoundingClientRect(), p = 8; return x >= r.left - p && x <= r.right + p && y >= r.top - p && y <= r.bottom + p; };
function dStart(e, i) { S.drag = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); const z = dzOf(); if (z) z.classList.add('arm'); }
function dEnd() { S.drag = null; const z = dzOf(); if (z) z.classList.remove('arm', 'hot'); }
function bindDz() {
  S.fresh = null; const z = dzOf(); if (!z) return;
  z.addEventListener('dragover', e => { if (S.drag == null) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; z.classList.add('hot'); });
  z.addEventListener('dragleave', e => { if (!z.contains(e.relatedTarget)) z.classList.remove('hot'); });
  z.addEventListener('drop', e => { e.preventDefault(); const i = S.drag, x = e.clientX, y = e.clientY; dEnd(); if (i != null) setTimeout(() => dress(i, x, y)); });
}
// Viste al personaje con la prenda desbloqueada i (x,y = punto donde se soltó, opcional)
function dress(i, x, y) {
  if (!S.unl[i] || S.done[i]) return;
  const m = missions()[S.mi]; S.done[i] = true; S.fresh = m.items[i].g; rGame();
  const cv = $('cv'), r = cv.getBoundingClientRect();
  if (x == null) sparkle(cv); else sparkle(cv, (x - r.left) + 'px', (y - r.top) + 'px');
  if (m.items.every((_, k) => S.done[k])) setTimeout(victory, 1100);
}
document.addEventListener('touchstart', e => {
  const el = e.target.closest && e.target.closest('.tool.unl');
  if (!el || e.touches.length !== 1) return;
  e.preventDefault(); const t = e.touches[0];
  Object.assign(T, {i:+el.dataset.i, moved:false, sx:t.clientX, sy:t.clientY});
}, {passive:false});
document.addEventListener('touchmove', e => {
  if (T.i == null) return; e.preventDefault(); const t = e.touches[0];
  if (!T.moved) {
    if (Math.hypot(t.clientX - T.sx, t.clientY - T.sy) < 8) return;
    const it = missions()[S.mi].items[T.i], g = document.createElement('div');
    T.moved = true; g.className = 'ghost'; g.textContent = V(it.g).icon + ' ' + V(it.g).es; document.body.appendChild(g); T.ghost = g;
    const z = dzOf(); if (z) z.classList.add('arm');
  }
  T.ghost.style.transform = `translate(${t.clientX}px,${t.clientY}px) translate(-50%,-130%)`;
  const z = dzOf(); if (z) z.classList.toggle('hot', inDz(t.clientX, t.clientY));
}, {passive:false});
const tEnd = e => {
  if (T.i == null) return;
  const i = T.i, t = e.changedTouches[0], end = e.type === 'touchend', over = end && T.moved && inDz(t.clientX, t.clientY);
  const tap = end && !T.moved, now = Date.now(), dbl = tap && T.lastI === i && now - T.last < 400;
  if (T.ghost) T.ghost.remove();
  T.last = tap && !dbl ? now : 0; T.lastI = i; Object.assign(T, {i:null, ghost:null, moved:false}); dEnd();
  if (over) dress(i, t.clientX, t.clientY); else if (dbl) dress(i);
};
document.addEventListener('touchend', tEnd); document.addEventListener('touchcancel', tEnd);

function openChallenge(i) {
  if (S.done[i] || S.unl[i]) return;
  const it = missions()[S.mi].items[i];
  S.q = {i, step:0, lock:false, t:[V(it.g), V(it.c), ...(it.m ? [V(it.m)] : [])]};   // prenda → color → (tono)
  rModal(); $('ov').classList.add('on');
}
function rModal() {
  const q = S.q, t = q.t[q.step], n = q.t.length;
  let pool = q.step === 0 ? cat('prenda') : q.step === 1 ? cat('color')
    : [V(t.id === 'claro' ? 'oscuro' : 'claro'), ...shuffle(cat('extra').filter(x => !['claro','oscuro'].includes(x.id))).slice(0, 1)];
  q.opts = shuffle([t, ...(q.step < 2 ? shuffle(pool.filter(x => x.id !== t.id)).slice(0, 2) : pool)]);
  const lead = ['la seña en LSC para', 'la seña en LSC para el color', 'la seña en LSC para el tono'][q.step];
  $('ov').innerHTML = `<div style="max-width:640px;width:100%;max-height:94vh;overflow:auto">${win('Reto_LSC — Paso ' + (q.step + 1) + ' de ' + n, `
    <h3 style="font-size:1.1rem;margin:0 0 12px;font-family:Montserrat;font-weight:800">Paso ${q.step + 1}: ¿Cuál es ${lead} “${t.es}”?</h3>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${q.opts.map((o, k) => `
      <button class="opt" onclick="answer('${o.id}',this)">${img(o, 'Opción ' + 'ABC'[k])}<div style="margin-top:6px">${MOSTRAR_PALABRA ? o.es : 'Opción ' + 'ABC'[k]}</div></button>`).join('')}</div>
    <p id="fb" style="font-weight:800;min-height:1.6em;margin:12px 0 0" aria-live="polite"></p>
    <button class="bv" onclick="$('ov').classList.remove('on')">Cerrar</button>`)}</div>`;
}
function answer(id, b) {
  const q = S.q; if (q.lock) return;
  const t = q.t[q.step], last = q.step === q.t.length - 1;
  if (id !== t.id) { b.classList.add('bad'); b.disabled = true; q.bad = true; $('fb').textContent = '✖ Casi. Mira otra vez las señas e inténtalo.'; return; }
  q.lock = true; b.classList.add('ok'); S.stat.t++; if (!q.bad) S.stat.ok++; q.bad = false;
  $('fb').textContent = last ? '★ ¡Prenda desbloqueada! Arrástrala al personaje ★' : '✦ ¡Correcto! Sigue con ' + (q.step ? 'el tono.' : 'el color.');
  setTimeout(() => {
    if (!last) { q.step++; q.lock = false; rModal(); return; }
    S.unl[q.i] = true; $('ov').classList.remove('on'); rGame();
  }, 800);
}
function sparkle(el, l = '45%', t = '45%') {
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span'); s.className = 'star'; s.innerHTML = `<img src="${spr(['sp','st','ht'][i % 3], SCOL[i % 4])}" width="22" height="22" alt="">`;
    s.style.cssText = `left:${l};top:${t};--x:${(Math.random() - .5) * 320}px;--y:${(Math.random() - .5) * 360}px`;
    el.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}
function victory() {
  const ms = missions(), m = ms[S.mi], worn = {}; m.items.forEach(it => worn[it.g] = colHex(it));
  S.cleared.add(m.i); S.stars++; setStars();
  const last = S.mi === ms.length - 1, all = S.cleared.size >= ms.length;
  $('ov').innerHTML = `<div style="max-width:420px;width:100%;text-align:center;max-height:94vh;overflow:auto">${win('Tus Resultados', `
    <h2 class="bub" style="font-size:2rem;margin:0">✦ ¡Look completado! ✦</h2>
    <div class="canvas" style="width:170px;height:250px;margin:10px auto;padding:6px">${doll(S.g, worn)}</div>
    ${results(S.stat.ok, S.stat.t)}
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="bv" onclick="startMission(${S.mi})">↻ Reintentar</button>
      ${true ? `<button class="bv go" onclick="$('ov').classList.remove('on');show(4)">★ Ronda bonus ★</button>` : ''}
      ${!last ? `<button class="bv go" onclick="startMission(${S.mi + 1})">Siguiente misión ▶</button>` : ''}
    </div>`)}</div>`;
  $('ov').classList.add('on'); sparkle($('ov').firstChild);
}

/* ---------- Pantalla 4: Ronda bonus (alterna Modalidad A y B) ---------- */
function rBonus() {
  if (!S.bonus) {
    const pool = shuffle(BONUS_IDS.map(V));
    S.bonus = {qs:pool.map((t, k) => ({t, mode:k % 2 ? 'B' : 'A'})), n:0, pts:0, err:false};
  }
  const b = S.bonus;
  if (b.n >= b.qs.length) {
    $('s4').innerHTML = win('Tus Resultados', `<h2 class="bub" style="font-size:2rem;margin:0">★ Tus Resultados ★</h2>
      ${results(b.pts, b.qs.length)}
      <button class="bv go" onclick="S.bonus=null;rBonus()">↻ Jugar de nuevo</button> <button class="bv" onclick="show(3)">Continuar al armario</button> <button class="bv" onclick="show(1)">Repasar glosario</button>`);
    return;
  }
  const {t, mode} = b.qs[b.n];
  b.opts = shuffle([t, ...shuffle(BONUS_IDS.map(V).filter(x => x.id !== t.id)).slice(0, 2)]);
  const head = mode === 'A' ? `✦ Modalidad A · ¿Cuál es la seña en LSC para “${t.es}”?` : '★ Modalidad B · ¿Qué significa esta seña?';
  const opts = mode === 'A'
    ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px">${b.opts.map((o, k) => `<button class="opt" onclick="ansB('${o.id}',this)">${img(o, 'Opción ' + 'ABC'[k])}<div style="margin-top:6px">${MOSTRAR_PALABRA ? o.es : 'Opción ' + 'ABC'[k]}</div></button>`).join('')}</div>`
    : `<div class="card" style="max-width:230px;margin:0 auto 12px">${img(t, 'Seña en LSC')}</div>
       <div style="display:grid;gap:8px;max-width:360px;margin:auto">${b.opts.map(o => `<button class="bv" onclick="ansB('${o.id}',this)">${o.es}</button>`).join('')}</div>`;
  $('s4').innerHTML = win('RondaBonus — ' + (b.n + 1) + '/' + b.qs.length, `<h2 style="font-size:1.15rem;margin:0 0 12px;font-weight:800">${head}</h2>${opts}<p id="fb4" style="font-weight:800;min-height:1.6em;text-align:center" aria-live="polite"></p>`);
}
function ansB(id, btn) {
  const b = S.bonus, t = b.qs[b.n].t;
  if (id !== t.id) { btn.classList.add('bad'); btn.disabled = true; b.err = true; $('fb4').textContent = '✖ Casi. Prueba con otra.'; return; }
  btn.classList.add('ok'); $('fb4').textContent = '★ ¡Correcto!';
  if (!b.err) { b.pts++; S.stars++; setStars(); sparkle($('s4')); }
  b.err = false; b.n++; setTimeout(rBonus, 900);
}

/* ---------- Menú, ayuda, barra de tareas ---------- */
function resetGame() { if (confirm('¿Reiniciar todo el progreso?')) { S.cleared = new Set(); S.stars = 0; S.bonus = null; S.mi = 0; S.done = []; S.unl = []; show(1); } }
function helpPop() {
  $('ov').innerHTML = `<div style="max-width:440px;width:100%">${win('Ayuda', `<p style="margin:0 0 8px;font-weight:700">✦ Aprende las señas en el glosario (toca las tarjetas para voltearlas).<br>★ Elige modelo y entra al armario.<br>⋆ Para desbloquear una prenda acierta su seña, su color y, si lo tiene, su tono (claro u oscuro).<br>👗 Luego arrástrala hasta el personaje para vestirlo (o haz doble clic sobre ella).<br>✦ La ronda bonus está siempre abierta: entra cuando quieras.</p><button class="bv go" onclick="$('ov').classList.remove('on')">Entendido ★</button>`)}</div>`;
  $('ov').classList.add('on');
}
function prog() {
  const ms = missions(), m = ms[S.mi], n = m && $('s3').classList.contains('on') && !S.cleared.has(m.i) ? m.items.filter((_, i) => S.done[i]).length / m.items.length : 0;
  $('pg').style.width = Math.round((S.cleared.size + n) / ms.length * 100) + '%';
  $('tbtxt').textContent = 'Misiones ' + S.cleared.size + '/' + ms.length;
}
const clk = () => $('clk').textContent = new Date().toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
clk(); setInterval(clk, 30000);
['sp','ht','st','sp','ht','st'].forEach((n, i) => { const e = document.createElement('img'); e.className = 'stk'; e.src = spr(n, SCOL[i % 4]); e.alt = ''; e.setAttribute('aria-hidden', 'true');
  e.style.cssText = `top:${8 + i * 15}%;${i % 2 ? 'right' : 'left'}:1.5%;animation-delay:${i * .6}s`; document.body.appendChild(e); });

show(1);
</script>
</body>
